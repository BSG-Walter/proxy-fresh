name: proxy check

on:
  schedule:
    - cron: "0/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check proxies
        run: |
          node check.js \
            --out proxies-valid.txt \
            --tcp-jobs 300 \
            --jobs 120 \
            --tcp-timeout 1200 \
            --timeout 6000

      - name: Commit results
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add proxies-valid.txt proxies-by-country.json
          git diff --cached --quiet || git commit -m "update $(date -u +%F-%H:%M)"
          git push
